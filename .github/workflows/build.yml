name: Build vehicles.json

on:
  push:
    branches: [main]
    paths:
      - 'data/vehicles/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vehicles.json
        run: bash build.sh

      - name: Commit updated vehicles.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vehicles.json
          git diff --cached --quiet || git commit -m "Auto-build vehicles.json"
          git push
